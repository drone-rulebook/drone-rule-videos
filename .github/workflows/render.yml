name: 動画をつくる

on:
  schedule:
    - cron: "17 16 * * *"   # 毎日 1時17分（日本時間）
    - cron: "17 4 * * *"    # 毎日 13時17分（日本時間）
  push:                      # 仕組みや設定を変えたときにも動かす（動画と結果の記録の更新では動かない）
    branches: [main]
    paths-ignore:
      - "videos/**"
      - "status.json"
      - "README.md"
  workflow_dispatch:         # 手で動かすとき（Actions の画面の「Run workflow」）

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pythonの部品を入れる
        run: pip install -q pillow numpy

      - name: 台本から動画をつくる
        run: python render.py

      - name: できた動画と結果を置く
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos
          if [ -f status.json ]; then git add status.json; fi
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -q -m "動画を作成 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            sleep 10
          done
          exit 1

name: 動画をつくる

on:
  schedule:
    - cron: "17 16 * * *"   # 毎日 1時17分（日本時間）
    - cron: "17 4 * * *"    # 毎日 13時17分（日本時間）
  push:                      # 仕組みや設定を変えたときにも動かす（動画と結果の記録の更新では動かない）
    branches: [main]
    paths-ignore:
      - "videos/**"
      - "status.json"
      - "README.md"
      - "docs/**"
      - "samples/**"
      - "tests/**"
  workflow_dispatch:         # 手で動かすとき（Actions の画面の「Run workflow」）

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 道具を入れる
        continue-on-error: true     # 入らなくても、pip の imageio-ffmpeg で動く
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pythonの部品を入れる
        run: pip install -q pillow numpy imageio-ffmpeg

      - name: 読み上げの部品を入れる（themes の「声」が「使う」のときだけ）
        continue-on-error: true     # 入らなければ、声なしで作る
        run: |
          ENGINE=$(python -c "import json;c=json.load(open('config.json'));t=json.load(open('themes/'+c.get('theme','drone')+'.json'));v=t.get('声',{});print(str(v.get('エンジン','OpenJTalk')).upper() if v.get('使う') else 'OFF')")
          echo "声のエンジン：$ENGINE"
          if [ "$ENGINE" = "VOICEVOX" ]; then
            docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
            for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 3; done
          elif [ "$ENGINE" = "OPENJTALK" ]; then
            sudo apt-get install -y -qq open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
          fi

      - name: 台本から動画をつくる
        run: python render.py

      - name: できた動画と結果を置く
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos
          if [ -f status.json ]; then git add status.json; fi
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -q -m "動画を作成 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull -q --rebase && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          # ほかの実行（同じ時間に動いた回）とぶつかったときは、この回の結果を捨てる。次の回で作り直す
          # （今日の動画が無いままなら、スプレッドシートのスクリプトが22時台にメールで知らせる）
          echo "::warning::ほかの実行とぶつかったため、この回の結果は置けませんでした（次の回で作り直します）"
          exit 0

name: 声ありの見本（一時的）

on:
  push:
    branches: [voice-sample]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg open-jtalk open-jtalk-mecab-naist-jdic hts-voice-nitech-jp-atr503-m001
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy imageio-ffmpeg
      - name: 声をオンにして見本をつくる
        run: |
          python - <<'PY'
          import json
          p = "themes/drone.json"
          t = json.load(open(p, encoding="utf-8"))
          t["声"]["使う"] = True
          json.dump(t, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          mkdir -p voice_samples
          for s in モーション 黒板 ノート; do python render.py --sample "voice_samples/声あり_$s.mp4" --style "$s"; done
          git checkout themes/drone.json
      - name: 見本を置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_samples
          git commit -q -m "声ありの見本"
          git push -q

name: 昼の2択の見本（一時的）

on:
  push:
    branches: [hiru-sample]
    paths-ignore:
      - "hiru_samples/out/**"

permissions:
  contents: write

concurrency:
  group: hiru-sample
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy imageio-ffmpeg
      - name: VOICEVOX を立てる
        run: |
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:50021/version && break; sleep 3; done
      - name: 見本をつくる（昼の2択）
        run: |
          rm -rf hiru_samples/out && mkdir -p hiru_samples/out
          python - <<'PY'
          import csv, json, sys
          sys.path.insert(0, ".")
          import render
          cfg = render.load_config(); th = render.load_theme(cfg)
          out = {}
          for r in csv.DictReader(open("hiru_samples/in.csv", encoding="utf-8")):
              vid = r["台本ID"].strip()
              sc, why = render.script_of(r)
              if sc is None:
                  out[vid] = "見送り：" + why; continue
              style = render.choose_look(vid, th, r)
              info = {}
              render.render(sc, f"hiru_samples/out/{vid}_{style}.mp4", th, style, info, vid=vid)
              render.contact_sheet(sc, th, style, f"hiru_samples/out/{vid}_{style}.png", vid=vid)
              out[vid] = dict(info, 型=style, 問題=sc["q1"])
          json.dump(out, open("hiru_samples/out/info.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
      - name: 見本を置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hiru_samples/out
          git commit -q -m "昼の2択の見本（ずんだもんの声）" || echo "変更なし"
          git push -q
